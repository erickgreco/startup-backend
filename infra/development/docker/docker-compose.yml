services:
  db:
    image: postgres:17.7
    container_name: startup_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: >
        -c max_connections=100
        -c shared_buffers=256MB
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - startup_network

volumes:
  db_data:
    driver: local

networks:
  startup_network:
    driver: bridge