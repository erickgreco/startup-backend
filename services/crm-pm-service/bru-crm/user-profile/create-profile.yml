info:
  name: create-profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/user-profile/create"
  body:
    type: json
    data: |-
      {
          "first_name": "Erick",
          "last_name": "Gutierrez Sanchez",
          "email": "erick@example.com",
          "phone_number": "+525512345678",
          "industry": "Software Development",
          "default_currency": "MXN",
          "language": "es"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
