info:
  name: quotes-create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/quotes/{{lead_id}}"
  body:
    type: json
    data: |-
      {
        "client_name": "Erick G",
        "client_email": "erick@test.com",
        "client_phone_number": "5512345678",
        "project_title": "Test",
        "project_description": "Proyecto de prueba",
        "project_estimated_duration_days": 30,
        "items": [
          {
            "description": "Desarrollo backend",
            "quantity": 16,
            "unit": "dias",
            "unit_price": 50.00
          },
          {
            "description": "Desarrollo frontend",
            "quantity": 15,
            "unit": "dias",
            "unit_price": 500.99
          },
          {
            "description": "Cloud service",
            "quantity": 3,
            "unit": "mockups",
            "unit_price": 200.00
          },
          {
            "description": "Landing page",
            "quantity": 2,
            "unit": "meses",
            "unit_price": 650.00
          }
        ],
        "payment_method": "upfront",
        "currency": "MXN",
        "notes": "nota de prueba"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const quoteId = response.data?.id;

        if (!quoteId) {
          console.error("No se encontro el ID en la respuesta");
          return;
        }

        bru.setEnvVar("quote_id", quoteId);
        console.log("quote_id guardado: ", quoteId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
